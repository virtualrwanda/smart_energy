<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meters Management - Energy Meter System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Energy Meter System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('meters_page') }}">Meters</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('recharge_page') }}">Recharge</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('prediction_page') }}">Predictions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('users_page') }}">Users</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link">Welcome, {{ current_user.username }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Register New Meter</h5>
                    </div>
                    <div class="card-body">
                        <form id="registerMeterForm">
                            <div class="mb-3">
                                <label for="serial_number" class="form-label">Serial Number</label>
                                <input type="text" class="form-control" id="serial_number" required>
                            </div>
                            <div class="mb-3">
                                <label for="owner_name" class="form-label">Owner Name</label>
                                <input type="text" class="form-control" id="owner_name" required>
                            </div>
                            <div class="mb-3">
                                <label for="owner_contact" class="form-label">Contact Number</label>
                                <input type="text" class="form-control" id="owner_contact" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Register Meter</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Registered Meters</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="metersTable">
                                <thead>
                                    <tr>
                                        <th>Serial Number</th>
                                        <th>Owner</th>
                                        <th>Contact</th>
                                        <th>Balance</th>
                                        <th>Last Updated</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded via AJAX -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this meter?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get CSRF token from meta tag
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        let deleteSerialNumber = null;

        // Load meters
        function loadMeters() {
            fetch('/api/registered_meters', {
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const tbody = document.querySelector('#metersTable tbody');
                    tbody.innerHTML = '';
                    data.data.forEach(meter => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${meter.serial_number}</td>
                                <td>${meter.owner_name}</td>
                                <td>${meter.owner_contact}</td>
                                <td>${meter.balance}</td>
                                <td>${meter.timestamp}</td>
                                <td>
                                    <button class="btn btn-sm btn-danger" onclick="showDeleteModal('${meter.serial_number}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            })
            .catch(error => {
                console.error('Error loading meters:', error);
                alert('Error loading meters');
            });
        }

        // Register meter
        document.getElementById('registerMeterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                serial_number: document.getElementById('serial_number').value,
                owner_name: document.getElementById('owner_name').value,
                owner_contact: document.getElementById('owner_contact').value
            };

            fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Meter registered successfully!');
                    document.getElementById('registerMeterForm').reset();
                    loadMeters();
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error registering meter');
            });
        });

        // Delete meter
        function showDeleteModal(serialNumber) {
            deleteSerialNumber = serialNumber;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }

        document.getElementById('confirmDelete').addEventListener('click', function() {
            if (deleteSerialNumber) {
                fetch(`/api/delete/${deleteSerialNumber}`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': csrfToken
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Meter deleted successfully!');
                        loadMeters();
                    } else {
                        alert('Error: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting meter');
                })
                .finally(() => {
                    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                    deleteSerialNumber = null;
                });
            }
        });

        // Initial load
        loadMeters();
    </script>
</body>
</html>
