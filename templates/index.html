<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Energy Meter System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Energy Meter System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('index') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('meters_page') }}">Meters</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('recharge_page') }}">Recharge</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('prediction_page') }}">Predictions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('users_page') }}">Users</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link">Welcome, {{ current_user.username }} (Admin)</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Meter Consumption</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="consumptionChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Recharge History</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="rechargeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Registered Meters</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="metersTable">
                                <thead>
                                    <tr>
                                        <th>Serial Number</th>
                                        <th>Owner</th>
                                        <th>Contact</th>
                                        <th>Balance</th>
                                        <th>Last Updated</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded via AJAX -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get CSRF token
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        // Fetch and display meters
        function loadMeters() {
            fetch('/api/registered_meters', {
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const tbody = document.querySelector('#metersTable tbody');
                    tbody.innerHTML = '';
                    data.data.forEach(meter => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${meter.serial_number}</td>
                                <td>${meter.owner_name}</td>
                                <td>${meter.owner_contact}</td>
                                <td>${meter.balance}</td>
                                <td>${meter.timestamp}</td>
                            </tr>
                        `;
                    });
                }
            });
        }

        // Load charts
        function loadCharts() {
            // Consumption Chart
            fetch('/api/data', {
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('consumptionChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d[0]),
                        datasets: [{
                            label: 'Consumption',
                            data: data.map(d => d[1]),
                            borderColor: 'rgb(75, 192, 192)'
                        }]
                    }
                });
            });

            // Recharge Chart
            fetch('/api/get_recharges', {
                headers: {
                    'X-CSRFToken': csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('rechargeChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d.timestamp),
                        datasets: [{
                            label: 'Recharge Amount',
                            data: data.map(d => d.recharge_amount),
                            backgroundColor: 'rgb(54, 162, 235)'
                        }]
                    }
                });
            });
        }

        // Initial load
        loadMeters();
        loadCharts();

        // Refresh every 30 seconds
        setInterval(loadMeters, 30000);
    </script>
</body>
</html>
